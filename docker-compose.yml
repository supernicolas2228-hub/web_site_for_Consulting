# Опционально: локальный PostgreSQL для других задач.
# Само приложение Next.js хранит аналитику в data/site-events.jsonl и НЕ требует этого контейнера.
#
# Запуск: docker compose up -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sellislife
      POSTGRES_PASSWORD: sellislife
      POSTGRES_DB: sellislife
    ports:
      - "5432:5432"
    volumes:
      - sellislife_pgdata:/var/lib/postgresql/data

volumes:
  sellislife_pgdata:
